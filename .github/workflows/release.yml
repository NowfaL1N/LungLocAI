name: Release (with test CT scans)

# Push a tag like v1.0.0 to build the synthetic test set and publish a GitHub Release with it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      recreate:
        description: "Delete and recreate the release + tag on the current main"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build test scans (fixed seeds -> identical every time)
        run: |
          python tools/make_test_set.py --out test_scans
          zip -r -0 LungLocAI_test_scans.zip test_scans
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          RECREATE: ${{ inputs.recreate }}
        run: |
          if [ "$RECREATE" = "true" ]; then
            gh release delete "$TAG" --cleanup-tag -y || true
            git push origin ":refs/tags/$TAG" 2>/dev/null || true
          fi
          gh release view "$TAG" >/dev/null 2>&1 && gh release upload "$TAG" LungLocAI_test_scans.zip --clobber \
            || gh release create "$TAG" LungLocAI_test_scans.zip --target "$GITHUB_SHA" --title "LungLocAI $TAG" --notes-file docs/release_notes.md
