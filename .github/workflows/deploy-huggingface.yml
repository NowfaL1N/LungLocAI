name: Deploy to Hugging Face Spaces

# Publishes the website at https://huggingface.co/spaces/<HF_SPACE>
# One-time setup (repo Settings -> Secrets and variables -> Actions):
#   secret   HF_TOKEN  = a Hugging Face access token with "write" permission
#   variable HF_SPACE  = <your-hf-username>/LungLocAI   (create it as an empty Docker Space first)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.HF_SPACE != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          test -n "$HF_TOKEN" || { echo "::error::Add the HF_TOKEN secret"; exit 1; }
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan hf-deploy
          # Spaces read their settings from YAML front matter at the top of README.md
          { printf -- '---\ntitle: LungLocAI\nemoji: 🫁\ncolorFrom: blue\ncolorTo: indigo\nsdk: docker\napp_port: 7860\npinned: false\nlicense: mit\nshort_description: CT lung nodule detection and lung-cancer risk with XGBoost\n---\n\n'; cat README.md; } > README.hf && mv README.hf README.md
          rm -rf .github notebooks docs   # Spaces reject binary files (images) pushed without Xet/LFS
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from GitHub"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" hf-deploy:main
